{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 900px;">
  <h2 class="mb-4 text-light">✍️ Sign / Verify Data</h2>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#sign" type="button">Sign</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#verify" type="button">Verify</button></li>
    {% if role == 'Admin' %}
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#create" type="button">Create Key</button></li>
    {% endif %}
  </ul>

  <!-- Tab content -->
  <div class="tab-content">

    <!-- SIGN -->
    <div class="tab-pane fade show active" id="sign">
      <form method="POST">
        <textarea name="message" class="form-control bg-dark text-light mb-3" rows="4" placeholder="Message to sign"></textarea>
        <select name="sign_key_id" class="form-select bg-dark text-light mb-3">
          <option value="">-- Choose Signing Key --</option>
            {% for key in keys %}
            <option value="{{ key.KeyId }}">
                {{ key.AliasName or key.Description or key.KeyId[:8] }} ({{ key.KeySpec }})
            </option>
            {% endfor %}
        </select>
        <button type="submit" name="action" value="sign" class="btn btn-primary">Sign</button>
      </form>
    </div>

    <!-- VERIFY -->
    <div class="tab-pane fade" id="verify">
      <form method="POST">
        <textarea name="message_to_verify" class="form-control bg-dark text-light mb-3" rows="4" placeholder="Message to verify"></textarea>
        <textarea name="signature" class="form-control bg-dark text-light mb-3" rows="3" placeholder="Signature (Base64)"></textarea>
        <select name="verify_key_id" class="form-select bg-dark text-light mb-3">
          <option value="">-- Choose Signing Key --</option>
            {% for key in keys %}
            <option value="{{ key.KeyId }}">
                {{ key.AliasName or key.Description or key.KeyId[:8] }} ({{ key.KeySpec }})
            </option>
            {% endfor %}
        </select>
        <button type="submit" name="action" value="verify" class="btn btn-success">Verify</button>
      </form>
    </div>

    <!-- Create Key Tab (Admins only) -->
        {% if role == 'Admin' %}
        <div class="tab-pane fade" id="create">
        <h5 class="text-light mb-3">Create New Signing Key</h5>

        <div class="mb-3">
            <label class="form-label text-light">Key Name</label>
            <input type="text" name="key_name" class="form-control bg-dark text-light" placeholder="e.g., signing-key-prod" required>
        </div>

        <div class="mb-3">
            <label class="form-label text-light">Description</label>
            <input type="text" name="description" class="form-control bg-dark text-light" placeholder="optional description (e.g., used for API signing)">
        </div>

        <div class="mb-3">
            <label class="form-label text-light">Key Type</label>
            <select name="key_type" class="form-select bg-dark text-light">
            <option value="RSA_2048">RSA 2048</option>
            <option value="RSA_4096">RSA 4096</option>
            <option value="ECC_P256">ECC NIST P256</option>
            <option value="ECC_SECG_P256K1">ECC SECG P256K1</option>
            </select>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" name="action" value="create_key" class="btn btn-warning fw-semibold">
            Create Key
            </button>
        </div>
        </div>
        {% endif %}


  </div>

  {% if result %}
  <div class="alert alert-secondary mt-4">
    <strong>Result:</strong>
    <textarea class="form-control bg-dark text-light" rows="3" readonly>{{ result }}</textarea>
  </div>
  {% endif %}
</div>
{% endblock %}
